<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人智慧記帳本與資產分析系統</title>
    <!-- 引入 Tailwind CSS 和 Chart.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 頂部導航欄 -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <span>💰</span> 個人智慧記帳本系統
            </h1>
            <div class="mt-3 sm:mt-0 flex gap-2">
                <button onclick="exportData()" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded text-sm font-medium transition flex items-center gap-1">📥 備份資料</button>
                <label class="bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded text-sm font-medium transition cursor-pointer flex items-center gap-1">
                    📤 還原資料 <input type="file" id="importFile" class="hidden" onchange="importData(event)">
                </label>
            </div>
        </div>
    </header>

    <!-- 分頁標籤列 -->
    <nav class="bg-white border-b shadow-sm sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 flex space-x-8">
            <button onclick="switchTab('tab-ledger', this)" class="tab-btn py-4 px-2 border-b-2 border-indigo-600 text-indigo-600 font-bold text-sm transition">📝 收支記帳本</button>
            <button onclick="switchTab('tab-insurance', this)" class="tab-btn py-4 px-2 border-b-2 border-transparent text-slate-500 hover:text-slate-700 font-medium text-sm transition">🛡️ 保險代墊管理</button>
            <button onclick="switchTab('tab-analytics', this)" class="tab-btn py-4 px-2 border-b-2 border-transparent text-slate-500 hover:text-slate-700 font-medium text-sm transition">📊 收支趨勢分析</button>
        </div>
    </nav>

    <!-- 主體內容區 -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">

        <!-- ================= 分頁一：收支記帳本 ================= -->
        <div id="tab-ledger" class="tab-content active space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2"><span>➕</span> 新增收支記錄</h2>
                <form id="ledgerForm" onsubmit="addLedgerItem(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">日期</label>
                        <input type="date" id="lDate" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">類型</label>
                        <select id="lType" onchange="updateCategoryOptions()" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="收入">收入</option>
                            <option value="支出">支出</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">類別</label>
                        <select id="lCategory" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <!-- 動態填入 -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">金額 (TWD)</label>
                        <input type="number" id="lAmount" min="1" required placeholder="請輸入金額" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">備註說明</label>
                        <input type="text" id="lNote" placeholder="例如：本薪 / 晚餐" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div class="flex items-end">
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition shadow-sm">新增記錄</button>
                    </div>
                </form>
            </div>

            <!-- 列表與篩選 -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                    <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2"><span>📋</span> 收支明細列表</h2>
                    <div class="flex gap-2 w-full sm:w-auto">
                        <input type="text" id="ledgerSearch" placeholder="搜尋備註或類別..." oninput="renderLedger()" class="border rounded-lg px-3 py-1.5 text-sm w-full sm:w-64 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 uppercase text-xs tracking-wider">
                                <th class="p-3 rounded-l-lg">日期</th>
                                <th class="p-3">類型</th>
                                <th class="p-3">類別</th>
                                <th class="p-3 text-right">金額</th>
                                <th class="p-3">備註說明</th>
                                <th class="p-3 text-center rounded-r-lg">操作</th>
                            </tr>
                        </thead>
                        <tbody id="ledgerTableBody" class="divide-y divide-slate-100">
                            <!-- 動態渲染 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ================= 分頁二：保險代墊管理 ================= -->
        <div id="tab-insurance" class="tab-content space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold text-slate-700 mb-4 flex items-center gap-2"><span>➕</span> 新增保險代墊記錄</h2>
                <form id="insuranceForm" onsubmit="addInsuranceItem(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">保戶/被保險人</label>
                        <input type="text" id="iName" required placeholder="例如：王小明" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">保單名稱/備註</label>
                        <input type="text" id="iPolicy" required placeholder="例如：終身壽險年繳" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">代墊金額 (TWD)</label>
                        <input type="number" id="iAmount" min="1" required placeholder="金額" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">支出日期</label>
                        <input type="date" id="iPayDate" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 mb-1">回收日期 (未回收留空)</label>
                        <input type="date" id="iReturnDate" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div class="flex items-end">
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition shadow-sm">新增代墊</button>
                    </div>
                </form>
            </div>

            <!-- 代墊列表 -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2"><span>🛡️</span> 保險代墊與回收明細</h2>
                    <div id="insuranceSummary" class="text-sm font-medium text-slate-600"></div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 uppercase text-xs tracking-wider">
                                <th class="p-3 rounded-l-lg">保戶姓名</th>
                                <th class="p-3">保單備註</th>
                                <th class="p-3 text-right">代墊金額</th>
                                <th class="p-3">支出日期</th>
                                <th class="p-3">回收日期</th>
                                <th class="p-3 text-center">狀態</th>
                                <th class="p-3 text-center rounded-r-lg">操作</th>
                            </tr>
                        </thead>
                        <tbody id="insuranceTableBody" class="divide-y divide-slate-100">
                            <!-- 動態渲染 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ================= 分頁三：收支趨勢分析 ================= -->
        <div id="tab-analytics" class="tab-content space-y-6">
            <!-- 數據總覽卡片 -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-medium text-slate-400 uppercase">總收入</p>
                        <h3 id="statTotalIncome" class="text-2xl font-bold text-emerald-600 mt-1">NT$ 0</h3>
                    </div>
                    <div class="p-3 bg-emerald-50 text-emerald-600 rounded-full text-xl">📈</div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-medium text-slate-400 uppercase">總支出</p>
                        <h3 id="statTotalExpense" class="text-2xl font-bold text-rose-600 mt-1">NT$ 0</h3>
                    </div>
                    <div class="p-3 bg-rose-50 text-rose-600 rounded-full text-xl">📉</div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-medium text-slate-400 uppercase">淨結餘</p>
                        <h3 id="statNetBalance" class="text-2xl font-bold text-indigo-600 mt-1">NT$ 0</h3>
                    </div>
                    <div class="p-3 bg-indigo-50 text-indigo-600 rounded-full text-xl">💎</div>
                </div>
            </div>

            <!-- 圖表區塊 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                    <h3 class="text-base font-bold text-slate-700 mb-4">📊 支出類別佔比分析</h3>
                    <div class="relative h-72 flex justify-center items-center">
                        <canvas id="expenseChart"></canvas>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                    <h3 class="text-base font-bold text-slate-700 mb-4">📅 每月收支趨勢對比</h3>
                    <div class="relative h-72 flex justify-center items-center">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- 頁腳 -->
    <footer class="bg-white border-t py-4 text-center text-xs text-slate-400 mt-auto">
        個人智慧記帳本與資產管理系統 &copy; 2026 (資料自動儲存於瀏覽器 LocalStorage)
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        // 分類定義
        const categories = {
            "收入": ["薪資", "股票賣出收入", "股票利息收入", "其他收入"],
            "支出": ["飲食", "醫療", "加油", "小孩教育", "儲蓄", "保險", "定存股", "房貸", "信用卡", "其他"]
        };

        // 資料初始化
        let ledgerData = JSON.parse(localStorage.getItem('ledgerData')) || [
            { id: 1, date: "2026-06-01", type: "收入", category: "薪資", amount: 65000, note: "6月份本薪" },
            { id: 2, date: "2026-06-05", type: "支出", category: "房貸", amount: 22000, note: "房貸月繳" },
            { id: 3, date: "2026-06-10", type: "支出", category: "飲食", amount: 8500, note: "伙食費" },
            { id: 4, date: "2026-06-15", type: "收入", category: "股票利息收入", amount: 3200, note: "台積電股利" }
        ];

        let insuranceData = JSON.parse(localStorage.getItem('insuranceData')) || [
            { id: 1, name: "王小明", policy: "終身醫療險代墊", amount: 15000, payDate: "2026-05-10", returnDate: "2026-05-25" },
            { id: 2, name: "李小華", policy: "意外險保費", amount: 6800, payDate: "2026-06-02", returnDate: "" }
        ];

        let expenseChartInstance = null;
        let trendChartInstance = null;

        // 初始化執行
        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('lDate').value = today;
            document.getElementById('iPayDate').value = today;

            updateCategoryOptions();
            renderLedger();
            renderInsurance();
            renderAnalytics();
        };

        // 切換分頁
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('border-indigo-600', 'text-indigo-600', 'font-bold');
                el.classList.add('border-transparent', 'text-slate-500', 'font-medium');
            });
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('border-indigo-600', 'text-indigo-600', 'font-bold');
            btn.classList.remove('border-transparent', 'text-slate-500', 'font-medium');

            if (tabId === 'tab-analytics') {
                renderAnalytics();
            }
        }

        // 更新類別選項
        function updateCategoryOptions() {
            const type = document.getElementById('lType').value;
            const categorySelect = document.getElementById('lCategory');
            categorySelect.innerHTML = '';
            categories[type].forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                categorySelect.appendChild(opt);
            });
        }

        // ================= 記帳本功能 =================
        function addLedgerItem(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                date: document.getElementById('lDate').value,
                type: document.getElementById('lType').value,
                category: document.getElementById('lCategory').value,
                amount: parseFloat(document.getElementById('lAmount').value),
                note: document.getElementById('lNote').value || '-'
            };
            ledgerData.push(newItem);
            saveAndRefreshLedger();
            document.getElementById('ledgerForm').reset();
            document.getElementById('lDate').value = new Date().toISOString().split('T')[0];
            updateCategoryOptions();
        }

        function deleteLedgerItem(id) {
            if (confirm('確定要刪除這筆記錄嗎？')) {
                ledgerData = ledgerData.filter(item => item.id !== id);
                saveAndRefreshLedger();
            }
        }

        function saveAndRefreshLedger() {
            localStorage.setItem('ledgerData', JSON.stringify(ledgerData));
            renderLedger();
        }

        function renderLedger() {
            const tbody = document.getElementById('ledgerTableBody');
            const keyword = document.getElementById('ledgerSearch').value.toLowerCase();
            tbody.innerHTML = '';

            const filtered = ledgerData.filter(item => 
                item.category.toLowerCase().includes(keyword) || 
                item.note.toLowerCase().includes(keyword) ||
                item.date.includes(keyword)
            );

            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-400">沒有找到相關記錄</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                const isIncome = item.type === '收入';
                tr.innerHTML = `
                    <td class="p-3 text-slate-600">${item.date}</td>
                    <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${isIncome ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">${item.type}</span></td>
                    <td class="p-3 font-medium text-slate-700">${item.category}</td>
                    <td class="p-3 text-right font-bold ${isIncome ? 'text-emerald-600' : 'text-slate-700'}">${isIncome ? '+' : '-'}$ ${item.amount.toLocaleString()}</td>
                    <td class="p-3 text-slate-500">${item.note}</td>
                    <td class="p-3 text-center">
                        <button onclick="deleteLedgerItem(${item.id})" class="text-rose-400 hover:text-rose-600 p-1 text-xs transition">🗑️ 刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ================= 保險代墊管理功能 =================
        function addInsuranceItem(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                name: document.getElementById('iName').value,
                policy: document.getElementById('iPolicy').value,
                amount: parseFloat(document.getElementById('iAmount').value),
                payDate: document.getElementById('iPayDate').value,
                returnDate: document.getElementById('iReturnDate').value
            };
            insuranceData.push(newItem);
            saveAndRefreshInsurance();
            document.getElementById('insuranceForm').reset();
            document.getElementById('iPayDate').value = new Date().toISOString().split('T')[0];
        }

        function deleteInsuranceItem(id) {
            if (confirm('確定要刪除這筆代墊記錄嗎？')) {
                insuranceData = insuranceData.filter(item => item.id !== id);
                saveAndRefreshInsurance();
            }
        }

        function toggleInsuranceStatus(id) {
            const item = insuranceData.find(i => i.id === id);
            if (item) {
                if (item.returnDate) {
                    item.returnDate = ""; 
                } else {
                    item.returnDate = new Date().toISOString().split('T')[0]; 
                }
                saveAndRefreshInsurance();
            }
        }

        function saveAndRefreshInsurance() {
            localStorage.setItem('insuranceData', JSON.stringify(insuranceData));
            renderInsurance();
        }

        function renderInsurance() {
            const tbody = document.getElementById('insuranceTableBody');
            const summaryDiv = document.getElementById('insuranceSummary');
            tbody.innerHTML = '';

            let totalPending = 0;
            let totalCollected = 0;

            insuranceData.sort((a, b) => new Date(b.payDate) - new Date(a.payDate));

            if (insuranceData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-slate-400">目前沒有保險代墊記錄</td></tr>`;
                summaryDiv.innerHTML = `未回收總額: NT$ 0`;
                return;
            }

            insuranceData.forEach(item => {
                const isReturned = Boolean(item.returnDate);
                if (isReturned) {
                    totalCollected += item.amount;
                } else {
                    totalPending += item.amount;
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="p-3 font-medium text-slate-700">${item.name}</td>
                    <td class="p-3 text-slate-600">${item.policy}</td>
                    <td class="p-3 text-right font-bold text-slate-700">NT$ ${item.amount.toLocaleString()}</td>
                    <td class="p-3 text-slate-500">${item.payDate}</td>
                    <td class="p-3 text-slate-500">${item.returnDate ? item.returnDate : '<span class="text-amber-500 italic">尚未回收</span>'}</td>
                    <td class="p-3 text-center">
                        <button onclick="toggleInsuranceStatus(${item.id})" class="px-2.5 py-1 rounded-full text-xs font-semibold transition ${isReturned ? 'bg-emerald-50 text-emerald-600 hover:bg-emerald-100' : 'bg-amber-50 text-amber-600 hover:bg-amber-100'}">
                            ${isReturned ? '✅ 已回收' : '⏳ 待回收 (點擊更改)'}
                        </button>
                    </td>
                    <td class="p-3 text-center">
                        <button onclick="deleteInsuranceItem(${item.id})" class="text-rose-400 hover:text-rose-600 p-1 text-xs transition">🗑️ 刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            summaryDiv.innerHTML = `未回收總額: <span class="text-rose-600 font-bold">NT$ ${totalPending.toLocaleString()}</span> | 已回收總額: <span class="text-emerald-600 font-bold">NT$ ${totalCollected.toLocaleString()}</span>`;
        }

        // ================= 收支趨勢分析與圖表 =================
        function renderAnalytics() {
            let totalIncome = 0;
            let totalExpense = 0;
            let expenseByCategory = {};

            categories["支出"].forEach(cat => expenseByCategory[cat] = 0);

            ledgerData.forEach(item => {
                if (item.type === '收入') {
                    totalIncome += item.amount;
                } else {
                    totalExpense += item.amount;
                    if (expenseByCategory[item.category] !== undefined) {
                        expenseByCategory[item.category] += item.amount;
                    } else {
                        expenseByCategory[item.category] = item.amount;
                    }
                }
            });

            const netBalance = totalIncome - totalExpense;

            document.getElementById('statTotalIncome').textContent = `NT$ ${totalIncome.toLocaleString()}`;
            document.getElementById('statTotalExpense').textContent = `NT$ ${totalExpense.toLocaleString()}`;
            const netEl = document.getElementById('statNetBalance');
            netEl.textContent = `NT$ ${netBalance.toLocaleString()}`;
            netEl.className = `text-2xl font-bold mt-1 ${netBalance >= 0 ? 'text-emerald-600' : 'text-rose-600'}`;

            const filteredExpenseLabels = [];
            const filteredExpenseData = [];
            Object.keys(expenseByCategory).forEach(cat => {
                if (expenseByCategory[cat] > 0) {
                    filteredExpenseLabels.push(cat);
                    filteredExpenseData.push(expenseByCategory[cat]);
                }
            });

            const ctxExpense = document.getElementById('expenseChart').getContext('2d');
            if (expenseChartInstance) expenseChartInstance.destroy();
            expenseChartInstance = new Chart(ctxExpense, {
                type: 'doughnut',
                data: {
                    labels: filteredExpenseLabels.length > 0 ? filteredExpenseLabels : ['尚無支出數據'],
                    datasets: [{
                        data: filteredExpenseData.length > 0 ? filteredExpenseData : [1],
                        backgroundColor: ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#14b8a6', '#f43f5e', '#64748b', '#94a3b8']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }
                }
            });

            let monthlyData = {};
            ledgerData.forEach(item => {
                const month = item.date.substring(0, 7); 
                if (!monthlyData[month]) {
                    monthlyData[month] = { income: 0, expense: 0 };
                }
                if (item.type === '收入') {
                    monthlyData[month].income += item.amount;
                } else {
                    monthlyData[month].expense += item.amount;
                }
            });

            const sortedMonths = Object.keys(monthlyData).sort();
            const incomeTrend = sortedMonths.map(m => monthlyData[m].income);
            const expenseTrend = sortedMonths.map(m => monthlyData[m].expense);

            const ctxTrend = document.getElementById('trendChart').getContext('2d');
            if (trendChartInstance) trendChartInstance.destroy();
            trendChartInstance = new Chart(ctxTrend, {
                type: 'bar',
                data: {
                    labels: sortedMonths.length > 0 ? sortedMonths : ['無資料'],
                    datasets: [
                        {
                            label: '收入',
                            data: incomeTrend.length > 0 ? incomeTrend : [0],
                            backgroundColor: '#10b981',
                            borderRadius: 4
                        },
                        {
                            label: '支出',
                            data: expenseTrend.length > 0 ? expenseTrend : [0],
                            backgroundColor: '#f43f5e',
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                        x: { grid: { display: false } }
                    },
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }
                }
            });
        }

        // ================= 資料備份與還原 =================
        function exportData() {
            const data = {
                ledger: ledgerData,
                insurance: insuranceData
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `my_accounting_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.ledger && parsed.insurance) {
                        ledgerData = parsed.ledger;
                        insuranceData = parsed.insurance;
                        saveAndRefreshLedger();
                        saveAndRefreshInsurance();
                        alert('資料還原成功！');
                    } else {
                        alert('檔案格式錯誤！');
                    }
                } catch (err) {
                    alert('解析檔案失敗，請確認檔案格式是否正確。');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
