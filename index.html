<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭收支存摺</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --paper: #f6f1e4;
    --paper-line: #d8cdaf;
    --ink: #1e3a52;
    --ink-soft: #46617a;
    --seal: #a4322f;
    --seal-soft: #c9645f;
    --gold: #b6902f;
    --income: #2f6b4f;
    --income-bg: #e7efe4;
    --expense: #a4322f;
    --expense-bg: #f5e8e2;
    --card-shadow: 0 2px 10px rgba(30,58,82,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: "Noto Serif TC","PMingLiU","Georgia",serif;
    background: linear-gradient(180deg,#e8e0cc,#f6f1e4 200px);
    color: var(--ink);
    min-height:100vh;
    padding-bottom:40px;
  }
  .cover{
    background: var(--ink);
    color:#f6f1e4;
    padding: 28px 20px 22px;
    position:relative;
    overflow:hidden;
    border-bottom: 6px double var(--gold);
  }
  .cover::before{
    content:"";
    position:absolute;
    inset:0;
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 14px);
  }
  .cover h1{
    margin:0;
    font-size: 1.55rem;
    letter-spacing: 0.12em;
    font-weight: 700;
  }
  .cover .sub{
    margin-top:6px;
    font-size:0.8rem;
    color:#c9bd9a;
    letter-spacing:0.08em;
  }
  .seal-stamp{
    position:absolute;
    right:18px;
    top:18px;
    width:58px;
    height:58px;
    border:3px solid var(--seal-soft);
    border-radius:6px;
    color:var(--seal-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.1rem;
    letter-spacing:0.15em;
    writing-mode: vertical-rl;
    transform: rotate(2deg);
    opacity:0.85;
    font-weight:700;
  }
  nav.tabs{
    display:flex;
    background:#efe6cd;
    border-bottom:1px solid var(--paper-line);
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 6px rgba(0,0,0,0.06);
  }
  nav.tabs button{
    flex:1;
    padding:13px 6px;
    background:none;
    border:none;
    font-family:inherit;
    font-size:0.86rem;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:3px solid transparent;
    transition: all .15s ease;
  }
  nav.tabs button.active{
    color:var(--ink);
    font-weight:700;
    border-bottom-color: var(--seal);
    background: var(--paper);
  }
  main{
    max-width: 720px;
    margin: 0 auto;
    padding: 18px 14px 10px;
  }
  .page{
    display:none;
  }
  .page.active{
    display:block;
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .card{
    background: var(--paper);
    border:1px solid var(--paper-line);
    border-radius:8px;
    box-shadow: var(--card-shadow);
    padding:16px;
    margin-bottom:16px;
    position:relative;
  }
  .card::after{
    content:"";
    position:absolute;
    left:14px; right:14px; top:0;
    height:1px;
    background: repeating-linear-gradient(90deg, var(--paper-line) 0 6px, transparent 6px 11px);
  }
  .card h2{
    margin:0 0 12px;
    font-size:1rem;
    letter-spacing:0.06em;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h2::before{
    content:"";
    width:6px;height:6px;
    background:var(--seal);
    border-radius:50%;
    display:inline-block;
  }

  .type-switch{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .type-switch button{
    flex:1;
    padding:9px;
    border-radius:6px;
    border:1px solid var(--paper-line);
    background:#fff;
    font-family:inherit;
    font-size:0.88rem;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .type-switch button.sel-income.active{
    background:var(--income-bg);
    border-color:var(--income);
    color:var(--income);
    font-weight:700;
  }
  .type-switch button.sel-expense.active{
    background:var(--expense-bg);
    border-color:var(--expense);
    color:var(--expense);
    font-weight:700;
  }

  label{
    display:block;
    font-size:0.75rem;
    color:var(--ink-soft);
    margin:10px 0 4px;
    letter-spacing:0.04em;
  }
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--paper-line);
    border-radius:6px;
    background:#fffdf7;
    font-family: inherit;
    font-size:0.92rem;
    color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:6px;
  }
  .chip{
    padding:5px 11px;
    border-radius:14px;
    border:1px solid var(--paper-line);
    background:#fff;
    font-size:0.78rem;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .chip.sel{
    background:var(--ink);
    color:#f6f1e4;
    border-color:var(--ink);
  }
  .btn-main{
    margin-top:14px;
    width:100%;
    padding:11px;
    border:none;
    border-radius:6px;
    background:var(--ink);
    color:#f6f1e4;
    font-family:inherit;
    font-size:0.95rem;
    letter-spacing:0.08em;
    cursor:pointer;
  }
  .btn-main:active{ transform: scale(0.99); }
  .btn-ghost{
    background:none;
    border:1px solid var(--paper-line);
    color:var(--ink-soft);
    padding:7px 12px;
    border-radius:6px;
    font-family:inherit;
    font-size:0.8rem;
    cursor:pointer;
  }

  .search-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .search-row input{ flex:1; }

  .entry-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 4px;
    border-bottom:1px dashed var(--paper-line);
  }
  .entry-row:last-child{ border-bottom:none; }
  .entry-icon{
    width:34px;height:34px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:0.95rem;
    flex-shrink:0;
    border:1px solid;
  }
  .entry-icon.income{ background:var(--income-bg); color:var(--income); border-color:var(--income);}
  .entry-icon.expense{ background:var(--expense-bg); color:var(--expense); border-color:var(--expense);}
  .entry-mid{ flex:1; min-width:0; }
  .entry-cat{ font-size:0.9rem; font-weight:700; }
  .entry-note{ font-size:0.76rem; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry-date{ font-size:0.72rem; color:#9a8f6f; margin-top:2px;}
  .entry-amt{
    font-family:"Courier New", monospace;
    font-size:0.98rem;
    font-weight:700;
    white-space:nowrap;
  }
  .entry-amt.income{ color:var(--income); }
  .entry-amt.expense{ color:var(--expense); }
  .entry-del{
    background:none;
    border:none;
    color:#b7a98a;
    font-size:1.1rem;
    cursor:pointer;
    padding:2px 4px;
  }
  .entry-del:hover{ color:var(--seal); }

  .empty-state{
    text-align:center;
    color:#a99a75;
    font-size:0.85rem;
    padding:24px 0;
  }

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:16px;
  }
  .stat-card{
    background:var(--paper);
    border:1px solid var(--paper-line);
    border-radius:8px;
    padding:12px 8px;
    text-align:center;
    box-shadow: var(--card-shadow);
  }
  .stat-card .lbl{ font-size:0.7rem; color:var(--ink-soft); }
  .stat-card .val{ font-family:"Courier New",monospace; font-size:1.05rem; font-weight:700; margin-top:4px; }
  .stat-card.income .val{ color:var(--income); }
  .stat-card.expense .val{ color:var(--expense); }
  .stat-card.balance .val{ color:var(--ink); }

  .status-pill{
    padding:4px 10px;
    border-radius:12px;
    font-size:0.72rem;
    border:1px solid;
    cursor:pointer;
    white-space:nowrap;
  }
  .status-pill.pending{ background:#fbeee0; color:#a4632f; border-color:#a4632f; }
  .status-pill.recovered{ background:var(--income-bg); color:var(--income); border-color:var(--income); }

  .ins-row{
    padding:12px 4px;
    border-bottom:1px dashed var(--paper-line);
  }
  .ins-row:last-child{ border-bottom:none; }
  .ins-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .ins-name{ font-weight:700; font-size:0.92rem; }
  .ins-note{ font-size:0.78rem; color:var(--ink-soft); margin-top:3px; }
  .ins-dates{ font-size:0.72rem; color:#9a8f6f; margin-top:4px; }
  .ins-amt{ font-family:"Courier New",monospace; font-weight:700; margin-top:6px; }
  .ins-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; }

  .backup-row{
    display:flex;
    gap:8px;
    margin-top:4px;
  }
  .backup-row .btn-ghost{ flex:1; text-align:center; }
  #importFile{ display:none; }

  .chart-wrap{
    position:relative;
    height:260px;
    margin-top:6px;
  }
  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#f6f1e4;
    padding:9px 18px;
    border-radius:20px;
    font-size:0.82rem;
    box-shadow:0 4px 14px rgba(0,0,0,0.2);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:100;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  @media (min-width:600px){
    .cover h1{ font-size:1.8rem; }
  }
</style>
</head>
<body>

<div class="cover">
  <div class="seal-stamp">記帳</div>
  <h1>家庭收支存摺</h1>
  <div class="sub">PASSBOOK LEDGER · 資料儲存於本機瀏覽器</div>
</div>

<nav class="tabs">
  <button class="tab-btn active" data-page="ledger">收支記帳本</button>
  <button class="tab-btn" data-page="insurance">保險代墊管理</button>
  <button class="tab-btn" data-page="trend">收支趨勢分析</button>
</nav>

<main>

  <!-- ================= 收支記帳本 ================= -->
  <section id="page-ledger" class="page active">

    <div class="card">
      <h2>新增一筆</h2>
      <div class="type-switch">
        <button type="button" class="sel-income active" data-type="income">收入</button>
        <button type="button" class="sel-expense" data-type="expense">支出</button>
      </div>

      <label>類別</label>
      <div class="chip-row" id="catChips"></div>

      <label>金額</label>
      <input type="number" id="ledAmount" placeholder="0" min="0">

      <label>日期</label>
      <input type="date" id="ledDate">

      <label>備註（選填）</label>
      <input type="text" id="ledNote" placeholder="例如：菜市場採買">

      <button class="btn-main" id="ledAddBtn">記一筆</button>
    </div>

    <div class="card">
      <h2>明細查詢</h2>
      <div class="search-row">
        <input type="text" id="ledSearch" placeholder="搜尋類別或備註關鍵字">
      </div>
      <div id="ledList"></div>
    </div>

    <div class="card">
      <h2>備份與還原</h2>
      <div class="backup-row">
        <button class="btn-ghost" id="exportBtn">匯出備份 (JSON)</button>
        <button class="btn-ghost" id="importBtn">匯入還原</button>
      </div>
      <input type="file" id="importFile" accept="application/json">
    </div>

  </section>

  <!-- ================= 保險代墊管理 ================= -->
  <section id="page-insurance" class="page">

    <div class="stat-grid">
      <div class="stat-card expense">
        <div class="lbl">待回收總額</div>
        <div class="val" id="insPendingTotal">0</div>
      </div>
      <div class="stat-card income">
        <div class="lbl">已回收總額</div>
        <div class="val" id="insRecoveredTotal">0</div>
      </div>
      <div class="stat-card balance">
        <div class="lbl">代墊筆數</div>
        <div class="val" id="insCount">0</div>
      </div>
    </div>

    <div class="card">
      <h2>新增代墊紀錄</h2>
      <label>保戶 / 被保險人</label>
      <input type="text" id="insName" placeholder="姓名">

      <label>保單備註</label>
      <input type="text" id="insNote" placeholder="保單號碼 / 險種等">

      <label>代墊金額</label>
      <input type="number" id="insAmount" placeholder="0" min="0">

      <label>支出日期</label>
      <input type="date" id="insPayDate">

      <label>回收日期（選填，回收後可補填）</label>
      <input type="date" id="insRecoverDate">

      <button class="btn-main" id="insAddBtn">新增紀錄</button>
    </div>

    <div class="card">
      <h2>代墊明細</h2>
      <div id="insList"></div>
    </div>

  </section>

  <!-- ================= 收支趨勢分析 ================= -->
  <section id="page-trend" class="page">

    <div class="stat-grid">
      <div class="stat-card income">
        <div class="lbl">總收入</div>
        <div class="val" id="trendIncome">0</div>
      </div>
      <div class="stat-card expense">
        <div class="lbl">總支出</div>
        <div class="val" id="trendExpense">0</div>
      </div>
      <div class="stat-card balance">
        <div class="lbl">淨結餘</div>
        <div class="val" id="trendBalance">0</div>
      </div>
    </div>

    <div class="card">
      <h2>支出類別佔比</h2>
      <div class="chart-wrap"><canvas id="pieChart"></canvas></div>
    </div>

    <div class="card">
      <h2>每月收支趨勢</h2>
      <div class="chart-wrap"><canvas id="barChart"></canvas></div>
    </div>

  </section>

</main>

<div class="toast" id="toast"></div>

<script>
/* ================= 資料層 ================= */
const LS_LEDGER = 'passbook_ledger_entries';
const LS_INSURANCE = 'passbook_insurance_records';

const CATS = {
  income: ['薪資','股票賣出收入','股票利息收入','其他收入'],
  expense: ['飲食','醫療','加油','小孩教育','儲蓄','保險','定存股','房貸','信用卡','其他']
};

function loadLedger(){
  try{ return JSON.parse(localStorage.getItem(LS_LEDGER)) || []; }catch(e){ return []; }
}
function saveLedger(arr){ localStorage.setItem(LS_LEDGER, JSON.stringify(arr)); }

function loadInsurance(){
  try{ return JSON.parse(localStorage.getItem(LS_INSURANCE)) || []; }catch(e){ return []; }
}
function saveInsurance(arr){ localStorage.setItem(LS_INSURANCE, JSON.stringify(arr)); }

let ledgerEntries = loadLedger();
let insuranceRecords = loadInsurance();

/* ================= 工具 ================= */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(n){ return Number(n||0).toLocaleString('zh-Hant-TW'); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ================= Tab 切換 ================= */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('page-'+btn.dataset.page).classList.add('active');
    if(btn.dataset.page === 'trend') renderCharts();
  });
});

/* ================= 記帳本：類別選擇 ================= */
let curType = 'income';
let curCat = CATS.income[0];

function renderCatChips(){
  const wrap = document.getElementById('catChips');
  wrap.innerHTML = '';
  CATS[curType].forEach(cat=>{
    const c = document.createElement('div');
    c.className = 'chip' + (cat===curCat ? ' sel' : '');
    c.textContent = cat;
    c.addEventListener('click', ()=>{ curCat = cat; renderCatChips(); });
    wrap.appendChild(c);
  });
}

document.querySelectorAll('.type-switch button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.type-switch button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    curType = btn.dataset.type;
    curCat = CATS[curType][0];
    renderCatChips();
  });
});

document.getElementById('ledDate').value = todayStr();
renderCatChips();

/* ================= 記帳本：新增 ================= */
document.getElementById('ledAddBtn').addEventListener('click', ()=>{
  const amount = parseFloat(document.getElementById('ledAmount').value);
  const date = document.getElementById('ledDate').value || todayStr();
  const note = document.getElementById('ledNote').value.trim();

  if(!amount || amount<=0){ showToast('請輸入正確金額'); return; }

  ledgerEntries.unshift({
    id: uid(),
    type: curType,
    category: curCat,
    amount: amount,
    date: date,
    note: note,
    ts: Date.now()
  });
  saveLedger(ledgerEntries);

  document.getElementById('ledAmount').value = '';
  document.getElementById('ledNote').value = '';
  renderLedgerList();
  showToast('已記一筆');
});

/* ================= 記帳本：列表 / 搜尋 / 刪除 ================= */
function renderLedgerList(){
  const keyword = document.getElementById('ledSearch').value.trim().toLowerCase();
  const list = document.getElementById('ledList');
  const filtered = ledgerEntries.filter(e=>{
    if(!keyword) return true;
    return e.category.toLowerCase().includes(keyword) || (e.note||'').toLowerCase().includes(keyword);
  });

  if(filtered.length===0){
    list.innerHTML = '<div class="empty-state">尚無符合的紀錄</div>';
    return;
  }

  list.innerHTML = filtered.map(e=>`
    <div class="entry-row">
      <div class="entry-icon ${e.type}">${e.type==='income' ? '入' : '出'}</div>
      <div class="entry-mid">
        <div class="entry-cat">${e.category}</div>
        ${e.note ? `<div class="entry-note">${escapeHtml(e.note)}</div>` : ''}
        <div class="entry-date">${e.date}</div>
      </div>
      <div class="entry-amt ${e.type}">${e.type==='income'?'+':'-'}${fmt(e.amount)}</div>
      <button class="entry-del" data-id="${e.id}" title="刪除">✕</button>
    </div>
  `).join('');

  list.querySelectorAll('.entry-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      ledgerEntries = ledgerEntries.filter(e=>e.id !== btn.dataset.id);
      saveLedger(ledgerEntries);
      renderLedgerList();
      showToast('已刪除');
    });
  });
}
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
document.getElementById('ledSearch').addEventListener('input', renderLedgerList);
renderLedgerList();

/* ================= 記帳本：匯出 / 匯入 ================= */
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const payload = { ledger: ledgerEntries, insurance: insuranceRecords, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `家庭收支存摺備份_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已匯出備份');
});

document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(Array.isArray(data.ledger)){
        ledgerEntries = data.ledger;
        saveLedger(ledgerEntries);
      }
      if(Array.isArray(data.insurance)){
        insuranceRecords = data.insurance;
        saveInsurance(insuranceRecords);
      }
      renderLedgerList();
      renderInsuranceList();
      showToast('已還原備份');
    }catch(err){
      showToast('檔案格式錯誤，匯入失敗');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ================= 保險代墊管理 ================= */
document.getElementById('insPayDate').value = todayStr();

document.getElementById('insAddBtn').addEventListener('click', ()=>{
  const name = document.getElementById('insName').value.trim();
  const note = document.getElementById('insNote').value.trim();
  const amount = parseFloat(document.getElementById('insAmount').value);
  const payDate = document.getElementById('insPayDate').value || todayStr();
  const recoverDate = document.getElementById('insRecoverDate').value || '';

  if(!name){ showToast('請輸入保戶姓名'); return; }
  if(!amount || amount<=0){ showToast('請輸入正確金額'); return; }

  insuranceRecords.unshift({
    id: uid(),
    name, note, amount, payDate, recoverDate,
    status: recoverDate ? 'recovered' : 'pending',
    ts: Date.now()
  });
  saveInsurance(insuranceRecords);

  document.getElementById('insName').value = '';
  document.getElementById('insNote').value = '';
  document.getElementById('insAmount').value = '';
  document.getElementById('insRecoverDate').value = '';

  renderInsuranceList();
  showToast('已新增代墊紀錄');
});

function renderInsuranceList(){
  const list = document.getElementById('insList');

  if(insuranceRecords.length===0){
    list.innerHTML = '<div class="empty-state">尚無代墊紀錄</div>';
  } else {
    list.innerHTML = insuranceRecords.map(r=>`
      <div class="ins-row">
        <div class="ins-top">
          <div class="ins-name">${escapeHtml(r.name)}</div>
          <button class="entry-del" data-id="${r.id}" title="刪除">✕</button>
        </div>
        ${r.note ? `<div class="ins-note">${escapeHtml(r.note)}</div>` : ''}
        <div class="ins-dates">支出：${r.payDate || '—'}　回收：${r.recoverDate || '尚未回收'}</div>
        <div class="ins-amt">$${fmt(r.amount)}</div>
        <div class="ins-actions">
          <span class="status-pill ${r.status}" data-id="${r.id}">${r.status==='recovered' ? '已回收' : '待回收'}</span>
        </div>
      </div>
    `).join('');
  }

  list.querySelectorAll('.status-pill').forEach(pill=>{
    pill.addEventListener('click', ()=>{
      const rec = insuranceRecords.find(r=>r.id===pill.dataset.id);
      if(!rec) return;
      if(rec.status === 'pending'){
        rec.status = 'recovered';
        if(!rec.recoverDate) rec.recoverDate = todayStr();
      } else {
        rec.status = 'pending';
        rec.recoverDate = '';
      }
      saveInsurance(insuranceRecords);
      renderInsuranceList();
    });
  });

  list.querySelectorAll('.entry-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      insuranceRecords = insuranceRecords.filter(r=>r.id !== btn.dataset.id);
      saveInsurance(insuranceRecords);
      renderInsuranceList();
      showToast('已刪除');
    });
  });

  const pending = insuranceRecords.filter(r=>r.status==='pending').reduce((s,r)=>s+Number(r.amount||0),0);
  const recovered = insuranceRecords.filter(r=>r.status==='recovered').reduce((s,r)=>s+Number(r.amount||0),0);
  document.getElementById('insPendingTotal').textContent = fmt(pending);
  document.getElementById('insRecoveredTotal').textContent = fmt(recovered);
  document.getElementById('insCount').textContent = insuranceRecords.length;
}
renderInsuranceList();

/* ================= 趨勢分析 ================= */
let pieChartInst, barChartInst;

function renderCharts(){
  const totalIncome = ledgerEntries.filter(e=>e.type==='income').reduce((s,e)=>s+Number(e.amount||0),0);
  const totalExpense = ledgerEntries.filter(e=>e.type==='expense').reduce((s,e)=>s+Number(e.amount||0),0);
  document.getElementById('trendIncome').textContent = fmt(totalIncome);
  document.getElementById('trendExpense').textContent = fmt(totalExpense);
  document.getElementById('trendBalance').textContent = fmt(totalIncome-totalExpense);

  // 支出類別佔比
  const expenseByCat = {};
  ledgerEntries.filter(e=>e.type==='expense').forEach(e=>{
    expenseByCat[e.category] = (expenseByCat[e.category]||0) + Number(e.amount||0);
  });
  const pieLabels = Object.keys(expenseByCat);
  const pieData = Object.values(expenseByCat);
  const pieColors = ['#a4322f','#b6902f','#46617a','#2f6b4f','#c9645f','#8a6d3b','#5b7a94','#7a4a2f','#9a8f6f','#6f4a4a'];

  const pieCtx = document.getElementById('pieChart').getContext('2d');
  if(pieChartInst) pieChartInst.destroy();
  pieChartInst = new Chart(pieCtx, {
    type:'pie',
    data:{
      labels: pieLabels.length ? pieLabels : ['尚無支出資料'],
      datasets:[{
        data: pieData.length ? pieData : [1],
        backgroundColor: pieLabels.length ? pieColors.slice(0,pieLabels.length) : ['#d8cdaf']
      }]
    },
    options:{
      plugins:{ legend:{ position:'bottom', labels:{ color:'#1e3a52', font:{family:"'Noto Serif TC', serif"} } } }
    }
  });

  // 每月收支趨勢
  const monthMap = {}; // {yyyy-mm: {income, expense}}
  ledgerEntries.forEach(e=>{
    const m = (e.date||'').slice(0,7);
    if(!m) return;
    if(!monthMap[m]) monthMap[m] = {income:0, expense:0};
    monthMap[m][e.type] += Number(e.amount||0);
  });
  const months = Object.keys(monthMap).sort();
  const incomeSeries = months.map(m=>monthMap[m].income);
  const expenseSeries = months.map(m=>monthMap[m].expense);

  const barCtx = document.getElementById('barChart').getContext('2d');
  if(barChartInst) barChartInst.destroy();
  barChartInst = new Chart(barCtx, {
    type:'bar',
    data:{
      labels: months.length ? months : ['尚無資料'],
      datasets:[
        { label:'收入', data: incomeSeries.length ? incomeSeries : [0], backgroundColor:'#2f6b4f' },
        { label:'支出', data: expenseSeries.length ? expenseSeries : [0], backgroundColor:'#a4322f' }
      ]
    },
    options:{
      scales:{
        x:{ ticks:{ color:'#46617a' }, grid:{ display:false } },
        y:{ ticks:{ color:'#46617a' }, grid:{ color:'#e6dfc8' } }
      },
      plugins:{ legend:{ position:'bottom', labels:{ color:'#1e3a52', font:{family:"'Noto Serif TC', serif"} } } }
    }
  });
}
</script>
